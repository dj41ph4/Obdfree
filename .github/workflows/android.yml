name: Android APK

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read and validate version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < VERSION)"
          grep -q "versionName = \"${VERSION}\"" app/build.gradle.kts
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Install Android SDK 36
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Guard paired-device Bluetooth permission surface
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -nE '^[[:space:]]*[A-Za-z_][A-Za-z0-9_]*\.(startDiscovery|cancelDiscovery)\(' app/src/main/java; then
            echo "Bluetooth discovery API found in paired-device-only flow."
            exit 1
          fi

      - name: Lint and unit tests
        run: gradle :app:lintDebug :app:testDebugUnitTest --stacktrace

      - name: Build debug APK for pull requests
        if: github.event_name == 'pull_request'
        run: gradle :app:assembleDebug --stacktrace

      - name: Reconstruct permanent release signing identity
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          OBDFREE_SIGNING_SEED: ${{ secrets.OBDFREE_SIGNING_SEED }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${OBDFREE_SIGNING_SEED:-}" ]; then
            echo "Missing repository secret OBDFREE_SIGNING_SEED"
            exit 1
          fi

          python3 -m pip install --disable-pip-version-check --quiet cryptography
          export OBDFREE_SIGNING_OUT="$GITHUB_WORKSPACE/.github/signing/generated"
          mkdir -p "$OBDFREE_SIGNING_OUT"
          python3 .github/signing/generate_release_identity.py > "$OBDFREE_SIGNING_OUT/fingerprint.txt"

          openssl pkcs12 -export \
            -name obdfree-release \
            -inkey "$OBDFREE_SIGNING_OUT/release-key.pem" \
            -in "$OBDFREE_SIGNING_OUT/release-cert.pem" \
            -out "$OBDFREE_SIGNING_OUT/obdfree-release.p12" \
            -passout "pass:$OBDFREE_SIGNING_SEED"

          keytool -importkeystore -noprompt \
            -srckeystore "$OBDFREE_SIGNING_OUT/obdfree-release.p12" \
            -srcstoretype PKCS12 \
            -srcstorepass "$OBDFREE_SIGNING_SEED" \
            -srcalias obdfree-release \
            -destkeystore "$OBDFREE_SIGNING_OUT/obdfree-release.jks" \
            -deststoretype JKS \
            -deststorepass "$OBDFREE_SIGNING_SEED" \
            -destkeypass "$OBDFREE_SIGNING_SEED" \
            -destalias obdfree-release

          rm -f "$OBDFREE_SIGNING_OUT/release-key.pem" "$OBDFREE_SIGNING_OUT/obdfree-release.p12"
          echo "OBDFREE_KEYSTORE_PATH=$OBDFREE_SIGNING_OUT/obdfree-release.jks" >> "$GITHUB_ENV"
          echo "OBDFREE_KEYSTORE_PASSWORD=$OBDFREE_SIGNING_SEED" >> "$GITHUB_ENV"

      - name: Build signed release APK
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: gradle :app:assembleRelease --stacktrace

      - name: Verify package and permanent release signature
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/apksigner.txt
          EXPECTED="$(tr -d '\r\n' < .github/signing/generated/fingerprint.txt | tr '[:upper:]' '[:lower:]')"
          ACTUAL="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' /tmp/apksigner.txt | head -n1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          test -n "$ACTUAL"
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "Release certificate mismatch"
            exit 1
          fi
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -q "package: name='com.obdfree.app'"

      - name: Upload signed APK artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: OBDfree-${{ steps.version.outputs.version }}-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Tag and publish signed release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          APK="OBDfree-${VERSION}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          SHA256="$(sha256sum "$APK" | awk '{print $1}')"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --tags

          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            TAG_COMMIT="$(git rev-list -n 1 "$TAG")"
            if [ "$TAG_COMMIT" != "$GITHUB_SHA" ]; then
              echo "Refusing to overwrite ${TAG}: it points to ${TAG_COMMIT}."
              exit 1
            fi
          else
            git tag -a "$TAG" -m "OBDfree ${VERSION}"
            git push origin "$TAG"
          fi

          NOTES=$(cat <<EOF
          OBDfree ${VERSION}

          - Première release signée avec l'identité retail permanente OBDfree.
          - Mise à jour automatique depuis GitHub Releases.
          - Vérification SHA-256, package Android et certificat de signature avant installation.
          - Les futures APK doivent conserver exactement cette identité de signature.

          SHA-256 APK: ${SHA256}
          EOF
          )

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
            gh release edit "$TAG" --title "OBDfree ${VERSION}" --notes "$NOTES"
          else
            gh release create "$TAG" "$APK" --title "OBDfree ${VERSION}" --notes "$NOTES"
          fi
