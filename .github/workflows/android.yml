name: Android APK

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read and validate version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < VERSION)"
          grep -q "versionName = \"${VERSION}\"" app/build.gradle.kts
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Install Android SDK 36
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Guard paired-device Bluetooth permission surface
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -nE '^[[:space:]]*[A-Za-z_][A-Za-z0-9_]*\.(startDiscovery|cancelDiscovery)\(' app/src/main/java; then
            echo "Bluetooth discovery API found in paired-device-only flow. This would require BLUETOOTH_SCAN on Android 12+."
            exit 1
          fi

      - name: Lint and unit tests
        run: gradle :app:lintDebug :app:testDebugUnitTest --stacktrace

      - name: Build debug APK for pull requests
        if: github.event_name == 'pull_request'
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare permanent release signing key
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.OBDFREE_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.OBDFREE_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64}" ] || [ -z "${KEYSTORE_PASSWORD}" ]; then
            echo "Missing OBDfree release signing secrets. Refusing to publish an unsigned APK."
            exit 1
          fi

          KEYSTORE_PATH="$RUNNER_TEMP/obdfree-release.jks"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"

          echo "OBDFREE_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "OBDFREE_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"

      - name: Build signed release APK
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: gradle :app:assembleRelease --stacktrace

      - name: Verify release signature
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Upload signed APK artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: OBDfree-${{ steps.version.outputs.version }}-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Tag and publish signed release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          APK="OBDfree-${VERSION}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --tags

          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            TAG_COMMIT="$(git rev-list -n 1 "$TAG")"
            if [ "$TAG_COMMIT" != "$GITHUB_SHA" ]; then
              echo "Refusing to overwrite ${TAG}: it already points to ${TAG_COMMIT}, not ${GITHUB_SHA}."
              exit 1
            fi
          else
            git tag -a "$TAG" -m "OBDfree ${VERSION}"
            git push origin "$TAG"
          fi

          NOTES="OBDfree ${VERSION}: APK Android signée avec la clé release permanente OBDfree et mise à jour automatique via GitHub Releases. Au démarrage, OBDfree détecte une version plus récente, télécharge l’APK, vérifie son SHA-256, son package et sa signature Android, puis ouvre l’installateur système."

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" --title "OBDfree ${VERSION}" --notes "$NOTES"
          fi
