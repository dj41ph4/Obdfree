name: Android APK

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: bash
        run: echo "version=$(tr -d '\r\n' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Install Android SDK 36
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Guard paired-device Bluetooth permission surface
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -nE '^[[:space:]]*[A-Za-z_][A-Za-z0-9_]*\.(startDiscovery|cancelDiscovery)\(' app/src/main/java; then
            echo "Bluetooth discovery API found in paired-device-only flow. This would require BLUETOOTH_SCAN on Android 12+."
            exit 1
          fi

      - name: Lint, unit tests and build debug APK
        run: gradle :app:lintDebug :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OBDfree-${{ steps.version.outputs.version }}-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Tag and publish release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          APK="OBDfree-${VERSION}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --tags

          if ! git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            git tag -a "$TAG" -m "OBDfree ${VERSION}"
            git push origin "$TAG"
          fi

          NOTES="OBDfree ${VERSION}: correctif Bluetooth Android 12+ pour les adaptateurs déjà appairés, reconnexion automatique conservée, erreurs utilisateur simplifiées, lecture/description FR des codes et effacement des défauts."

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" --title "OBDfree ${VERSION}" --notes "$NOTES"
          fi
